<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061120">
<title>Masuk ke Kamisah AI</title>
<meta name="description" content="Masuk atau daftar akun Kamisah AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#030c19;color:#f7fbff;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.screen{min-height:100dvh;position:relative;display:flex;align-items:center;justify-content:center;padding:28px 16px;background:linear-gradient(180deg,rgba(3,12,25,.15),rgba(3,12,25,.94) 43%,#030c19 100%),url("assets/kamisah-hero.webp") center top/auto 48vh no-repeat}
.card{width:min(100%,440px);border:1px solid rgba(126,174,215,.35);border-radius:30px;background:rgba(4,17,33,.88);box-shadow:0 24px 80px #0008;backdrop-filter:blur(20px);padding:25px 20px 20px;margin-top:clamp(100px,25vh,220px)}
.brand{text-align:center;margin-bottom:20px}.logo{width:54px;height:54px;margin:auto auto 4px;display:block}.brand h1{font-size:30px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-1px}.brand h1 span{color:#b477ff}.brand p{font-size:12px;color:#b8c6d9;margin:5px 0 0}
h2{text-align:center;font-size:22px;letter-spacing:-.5px;margin:0 0 6px}.intro{text-align:center;color:#b8c6d9;font-size:13px;line-height:1.55;margin:0 0 18px}
.oauth{width:100%;height:47px;border-radius:14px;border:1px solid #d7e0ea;background:#f9fbff;color:#101827;font-family:inherit;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:11px;margin:9px 0;cursor:pointer}.oauth svg{width:21px;height:21px}.oauth.apple{background:#fff}.divider{display:flex;align-items:center;gap:12px;color:#91a4bc;font-size:12px;margin:15px 0}.divider:before,.divider:after{content:"";height:1px;background:#29405a;flex:1}
label{display:block;font-size:12px;font-weight:700;color:#dce7f5;margin:12px 0 7px}.field{position:relative;display:flex;align-items:center;border:1px solid #304a67;background:#0c1c30;border-radius:13px;min-height:47px}.field .field-icon{width:19px;height:19px;margin-left:13px;color:#c9d7e8;flex-shrink:0}.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:13px 12px;font:500 13px inherit}.field input::placeholder{color:#8ea0b7}.toggle{border:0;background:transparent;color:#c7d4e5;padding:10px 12px;cursor:pointer;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 16px;font-size:12px;color:#b9c8dc}.remember{display:flex;align-items:center;gap:7px;margin:0;font-weight:500;color:#b9c8dc}.remember input{accent-color:#a336ff;width:16px;height:16px}.textbtn{border:0;background:transparent;color:#b77aff;font-weight:700;font-size:12px;cursor:pointer;padding:0}
.submit{width:100%;border:0;border-radius:15px;min-height:50px;background:linear-gradient(100deg,#12c9ff,#463cff 54%,#f000d6);color:white;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 25px #4b36ff38}.submit:disabled,.oauth:disabled{opacity:.65;cursor:wait}
.switch{text-align:center;color:#b8c6d9;font-size:12px;margin:17px 0}.switch button{color:#b77aff;background:none;border:0;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer}
.secure{display:flex;align-items:center;gap:11px;margin-top:20px;padding:13px;border:1px solid #194d62;border-radius:16px;background:linear-gradient(100deg,#07344399,#19183e99);font-size:11px;color:#c2d2e5}.secure .shield{font-size:25px;color:#5cf4d0}.secure b{display:block;color:#edfaff;font-size:11px;margin-bottom:3px}.msg{display:none;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.5;margin:12px 0}.msg.show{display:block}.msg.error{background:#4b1624;color:#ffd6df;border:1px solid #963b52}.msg.ok{background:#103b31;color:#b7ffdf;border:1px solid #26765e}.back{display:block;text-align:center;color:#9eb1c9;text-decoration:none;font-size:12px;margin-top:17px}
@media(max-width:380px){.card{padding:22px 16px 17px;border-radius:24px;margin-top:100px}.brand h1{font-size:27px}.screen{padding:16px 12px;background-size:auto 42vh}.oauth{height:44px}.intro{font-size:12px}}
</style>
</head>
<body>
<main class="screen">
<section class="card">
  <header class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18e1ff"/><stop offset=".55" stop-color="#3458ff"/><stop offset="1" stop-color="#ed2cf5"/></linearGradient></defs><path d="M10 8Q10 2 17 6L57 28Q65 32 57 37L17 59Q10 63 10 55Z" fill="url(#lg)"/><path d="M25 19L46 31L25 44Z" fill="#061426"/></svg>
    <h1>Kamisah <span>AI</span></h1>
    <p>Buat Cerita, Visualkan, Jadi Nyata</p>
  </header>

  <h2 id="formTitle">Masuk ke Akun Kamu</h2>
  <p class="intro" id="formIntro">Lanjutkan perjalanan kreatifmu<br>bersama Kamisah AI</p>

  <button class="oauth" id="googleBtn" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.72 7.18l7.62 5.91c4.45-4.1 7.14-10.15 7.14-17.56z"/><path fill="#FBBC05" d="M10.53 28.59a14.4 14.4 0 0 1 0-9.18l-7.98-6.19a23.9 23.9 0 0 0 0 21.56z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.89l-7.62-5.91c-2.12 1.42-4.84 2.26-8.28 2.26-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Masuk dengan Google
  </button>

  <button class="oauth apple" id="appleBtn" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#111" d="M16.37 12.2c.02 2.16 1.9 2.88 1.92 2.89-.02.05-.3 1.03-.99 2.04-.6.88-1.23 1.76-2.22 1.78-.97.02-1.28-.57-2.39-.57-1.1 0-1.45.55-2.37.59-.95.04-1.68-.95-2.29-1.82-1.25-1.81-2.2-5.12-.92-7.36.64-1.11 1.78-1.81 3.01-1.83.94-.02 1.83.64 2.4.64.57 0 1.64-.79 2.77-.67.47.02 1.8.19 2.65 1.45-.07.04-1.58.92-1.57 2.86zM14.55 5.97c.5-.6.83-1.43.74-2.26-.72.03-1.59.48-2.11 1.08-.46.53-.87 1.38-.76 2.19.8.06 1.62-.41 2.13-1.01z"/></svg>
    Masuk dengan Apple
  </button>

  <div class="divider">atau</div>

  <form id="authForm">
    <label for="email">Email</label>
    <div class="field">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
      <input id="email" type="email" autocomplete="email" placeholder="Masukkan email kamu" required>
    </div>

    <label for="password">Kata Sandi</label>
    <div class="field">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <input id="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" minlength="8" required>
      <button class="toggle" id="showPassword" type="button" aria-label="Tampilkan kata sandi">◉</button>
    </div>

    <div class="row">
      <label class="remember"><input id="remember" type="checkbox" checked> Ingat saya</label>
      <button class="textbtn" id="forgotBtn" type="button">Lupa kata sandi?</button>
    </div>

    <div class="msg" id="message" role="status" aria-live="polite"></div>
    <button class="submit" id="submitBtn" type="submit">Masuk <span aria-hidden="true">→</span></button>
  </form>

  <p class="switch" id="switchLine">Belum punya akun? <button id="switchMode" type="button">Daftar sekarang</button></p>

  <div class="secure"><span class="shield">✓</span><span><b>Login aman</b>Gunakan akunmu untuk melanjutkan perjalanan kreatif di Kamisah AI.</span></div>
  <a class="back" href="welcome.html">← Kembali ke halaman pembuka</a>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const message = $('message');
  const submit = $('submitBtn');
  let isSignUp = new URLSearchParams(location.search).get('mode') === 'signup';
  let isRecovery = false;
  let sb = null;

  function say(text, type='error') {
    message.textContent = text;
    message.className = 'msg show ' + type;
  }
  function setMode(signup) {
    isSignUp = signup;
    $('formTitle').textContent = signup ? 'Buat Akun Kamisah' : 'Masuk ke Akun Kamu';
    $('formIntro').innerHTML = signup
      ? 'Daftar untuk memulai perjalanan kreatifmu<br>bersama Kamisah AI'
      : 'Lanjutkan perjalanan kreatifmu<br>bersama Kamisah AI';
    submit.innerHTML = signup ? 'Daftar Sekarang →' : 'Masuk →';
    $('switchLine').innerHTML = signup
      ? 'Sudah punya akun? <button id="switchMode" type="button">Masuk sekarang</button>'
      : 'Belum punya akun? <button id="switchMode" type="button">Daftar sekarang</button>';
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    $('forgotBtn').style.visibility = signup ? 'hidden' : 'visible';
    message.className = 'msg';
  }
  function ready() {
    const c = window.KH || {};
    if (!window.supabase || !c.SUPABASE_URL || !c.SUPABASE_PUBLISHABLE_KEY) {
      say('Konfigurasi login belum tersedia. Periksa config.js.');
      return false;
    }
    if (!sb) sb = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_PUBLISHABLE_KEY);
    return true;
  }

  function setRecoveryMode() {
    isRecovery = true;
    $('formTitle').textContent = 'Buat Kata Sandi Baru';
    $('formIntro').textContent = 'Buat kata sandi baru untuk akun Kamisah AI.';
    $('googleBtn').style.display = 'none';
    $('appleBtn').style.display = 'none';
    document.querySelector('.divider').style.display = 'none';
    $('email').closest('.field').parentElement.querySelector('label').style.display = 'none';
    $('email').closest('.field').style.display = 'none';
    $('password').closest('.field').previousElementSibling.textContent = 'Kata Sandi Baru';
    document.querySelector('.row').style.display = 'none';
    $('switchLine').style.display = 'none';
    submit.textContent = 'Simpan Kata Sandi →';
    $('forgotBtn').style.display = 'none';
    $('password').value = '';
    $('password').focus();
  }

  setMode(isSignUp);
  if (ready()) {
    sb.auth.getSession().then(({data}) => {
      const recoveryInHash = new URLSearchParams(location.hash.slice(1)).get('type') === 'recovery';
      if (recoveryInHash) setRecoveryMode();
      else if (data.session) location.replace('index.html');
    });
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') setRecoveryMode();
    });
  }
  $('switchLine').addEventListener('click', event => {
    if (event.target.closest('#switchMode')) setMode(!isSignUp);
  });
  $('showPassword').addEventListener('click', () => {
    const field = $('password');
    field.type = field.type === 'password' ? 'text' : 'password';
    $('showPassword').textContent = field.type === 'password' ? '◉' : '◎';
  });

  $('authForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (!ready()) return;
    const email = $('email').value.trim();
    const password = $('password').value;
    if (password.length < 8) return say('Kata sandi harus minimal 8 karakter.');
    submit.disabled = true;
    submit.textContent = isSignUp ? 'Membuat akun…' : 'Memeriksa akun…';
    try {
      if (isRecovery) {
        const {error} = await sb.auth.updateUser({password});
        if (error) throw error;
        say('Kata sandi berhasil diperbarui. Membuka beranda Kamisah…', 'ok');
        setTimeout(() => location.replace('index.html'), 900);
      } else {
        const result = isSignUp
          ? await sb.auth.signUp({email, password, options:{emailRedirectTo:location.origin + '/index.html'}})
          : await sb.auth.signInWithPassword({email, password});
        if (result.error) throw result.error;
        if (result.data.session) {
          say('Berhasil. Membuka beranda Kamisah…', 'ok');
          location.replace('index.html');
        } else if (isSignUp) {
          say('Akun berhasil dibuat. Periksa email untuk konfirmasi, lalu masuk.', 'ok');
        } else {
          say('Login belum menghasilkan sesi. Periksa email dan kata sandi.');
        }
      }
    } catch (err) {
      say(err.message || 'Tidak dapat masuk. Coba lagi.');
    } finally {
      submit.disabled = false;
      submit.innerHTML = isSignUp ? 'Daftar Sekarang →' : 'Masuk →';
    }
  });

  async function oauth(provider) {
    if (!ready()) return;
    try {
      const {error} = await sb.auth.signInWithOAuth({
        provider,
        options:{redirectTo:location.origin + '/index.html'}
      });
      if (error) throw error;
    } catch (err) {
      say('Login ' + (provider === 'google' ? 'Google' : 'Apple') + ' belum berhasil: ' + (err.message || 'coba lagi') + '. Pastikan provider sudah diaktifkan di Supabase.');
    }
  }
  $('googleBtn').addEventListener('click', () => oauth('google'));
  $('appleBtn').addEventListener('click', () => oauth('apple'));

  $('forgotBtn').addEventListener('click', async () => {
    if (!ready()) return;
    const email = $('email').value.trim();
    if (!email) return say('Masukkan email terlebih dahulu, lalu tekan Lupa kata sandi.');
    try {
      const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo:location.origin + '/login.html'});
      if (error) throw error;
      say('Jika email terdaftar, tautan pemulihan akan dikirim ke email tersebut.', 'ok');
    } catch (err) {
      say(err.message || 'Permintaan pemulihan kata sandi gagal.');
    }
  });
})();
</script>
</body>
</html>
