<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI Video Generator — Kamisah</title>
<meta name="google-site-verification" content="KCP7oIVcMGBj-562M0-17TOQTb08VqAHyn9xyszXQQ0" />
<meta name="description" content="Buat video AI dari teks, gambar, atau video. Kelola dalam project, generate banyak sekaligus.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}</script>
<style>
@keyframes sl{from{transform:translateX(40px);opacity:0}}@keyframes sr{from{transform:translateX(-40px);opacity:0}}
.sl{animation:sl .22s}.sr{animation:sr .22s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style id="kh-project-mobile-redesign">
@media(max-width:640px){
  #khProject .kh-media-strip{scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #khProject .kh-media-strip::-webkit-scrollbar{display:none}
  #khProject section{scroll-margin-top:60px}
  #khProject h2{letter-spacing:-.02em}
  #view .fixed.inset-x-0.bottom-0{padding-left:14px;padding-right:14px;padding-bottom:calc(12px + env(safe-area-inset-bottom));box-shadow:0 -14px 36px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);border-bottom:0}
  #view .fixed.inset-x-0.bottom-0 textarea#pr{font-size:16px;line-height:1.45;min-height:68px;max-height:132px;padding:8px 2px}
  #view #plus{width:46px;height:46px;flex:0 0 46px;border-radius:15px;background:#27272a}
  #view #go{width:50px;height:50px;flex:0 0 50px}
  #view #chip{max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px;padding:10px 12px}
  #view #cost{font-size:11px;line-height:1.35}
}
</style>

</head>
<body class="bg-black text-neutral-100 font-sans">
<div id="view"></div><div id="sheet"></div>
  <div class="mx-auto max-w-4xl px-4 pt-3"><div class="rounded-xl border border-amber-500/30 bg-amber-950/20 p-3 text-xs text-amber-200">💳 Biaya kredit akan ditampilkan sebelum generasi. Sistem kredit belum aktif sampai backend dikonfigurasi.</div></div>
<div id="toast" role="status" class="fixed top-4 left-1/2 -translate-x-1/2 z-[60] hidden max-w-[90%] bg-neutral-800 border border-amber-500/40 px-4 py-2 rounded-full text-xs font-semibold shadow-xl"></div>
<input id="file" type="file" accept="image/*,video/*" multiple class="hidden">
<script src="config.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== KONFIGURASI =====
// Harga (kredit) = ANGKA SEMENTARA. Ganti setelah menghitung dari harga API-mu (1 kredit = Rp100).
// Model & kemampuannya hanya konfigurasi: pastikan penyedia API-mu benar-benar menyediakannya.
const MODELS=[
 {id:'omni-flash',name:'Omni 1.1 Flash',on:false,note:'API terpisah',modes:[],res:['720p'],dur:[4,15]},
 {id:'seedance-2.0-fast',name:'Seedance 2.0 Fast',on:true,modes:['text','image'],res:['480p','720p'],dur:[4,15],rates:{'480p':13,'720p':26}},
 {id:'seedance-2.0',name:'Seedance 2.0',on:true,modes:['text','image'],res:['480p','720p','1080p'],dur:[4,15],rates:{'480p':16,'720p':32,'1080p':80}},
 {id:'seedance-2.5',name:'Seedance 2.5',on:true,modes:['text','image'],res:['480p','720p','1080p'],dur:[4,30],rates:{'480p':24,'720p':49,'1080p':120}}
];
const ENDPOINT='/.netlify/functions/seedance';
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,10),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={projects:[],set:{model:'seedance-2.0-fast',ratio:'9:16',res:'720p',n:1,dur:10}},U={},CTX='text',DIR=0,SV='set';
let PEND=null;try{PEND=localStorage.getItem('kh_vprompt')}catch{}
const M=id=>MODELS.find(m=>m.id===id),cur=()=>M(S.set.model),ok=(m,mode)=>m.on&&m.modes.includes(mode);
const price=()=>{const m=cur();return (m.rates?Math.ceil(m.rates[S.set.res]*S.set.dur):(m.cost||0))*S.set.n};
function fit(mode){CTX=mode;let m=cur();if(!ok(m,mode)){const f=MODELS.find(x=>ok(x,mode));if(f)S.set.model=f.id}m=cur();if(!m.res.includes(S.set.res))S.set.res=m.res[0];if(m.dur)S.set.dur=Math.min(Math.max(S.set.dur,m.dur[0]),m.dur[1])}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3200)}

// ===== Penyimpanan di browser (IndexedDB). Sementara, sampai login + Supabase siap =====
const idb=new Promise(r=>{try{const q=indexedDB.open('kreatorhub',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
async function load(){const d=await idb;if(!d)return;return new Promise(r=>{const q=d.transaction('s').objectStore('s').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}
let st;function save(){clearTimeout(st);st=setTimeout(async()=>{const d=await idb;try{d&&d.transaction('s','readwrite').objectStore('s').put(S,'db')}catch{}},300)}

// ===== API & antrean generate (paralel, tidak saling menunggu) =====
async function api(p){const h={'Content-Type':'application/json'};if(SES)h.Authorization='Bearer '+SES.access_token;const r=await fetch(ENDPOINT,{method:'POST',headers:h,body:JSON.stringify(p)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Permintaan gagal (${r.status}).`);return d}
async function imgData(b){const i=await createImageBitmap(b),s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)}
async function run(it,payload){
 try{
  if(!it.jobId){it.jobId=(await api(payload)).id;save();refreshBal()}
  for(let i=0;i<150&&!it.gone;i++){await sleep(5000);const s=await api({action:'status',id:it.jobId});
   if(s.state==='done'){if(!s.url)throw Error('Video selesai, tetapi tautan hasil tidak tersedia.');it.url=s.url;it.status='ready';return fin(it)}
   if(s.state==='failed')throw Error(s.error||'Pembuatan video gagal.')}
  if(!it.gone)throw Error('Proses terlalu lama.')
 }catch(e){it.status='failed';it.error=e.message;fin(it)}
}
function fin(it){save();refreshBal();if(it.gone)return;const[,k,,b]=location.hash.split('/');if(k!=='v'||b===it.id){const y=scrollY;route();scrollTo(0,y)}}
async function generate(p,src,prompt){
 const m=cur(),mode=src?src.type:'text',pr=prompt.trim();
 if(!ok(m,mode))return toast('Model ini belum mendukung mode itu. Pilih model lain.');
 if(!pr)return toast('Tulis prompt dulu.');
 if(SB&&!SES)return openAuth('Masuk dulu untuk generate video.');
 if(BAL!==null&&price()>BAL)return toast('Saldo kredit kurang.');
 if(mode==='video'&&!src.url)return toast('Video unggahan butuh penyimpanan online (segera hadir). Pakai gambar atau video hasil generate.');
 let reference_image_urls=[];
 if(mode==='image'){
  try{
   const cap=m.id==='seedance-2.5'?30:9;
   const candidates=p.items.filter(x=>x.type==='image'&&x.blob&&x.status==='ready').slice(0,cap);
   if(!candidates.some(x=>x.id===src.id))candidates.unshift(src);
   const unique=[...new Map(candidates.map(x=>[x.id,x])).values()].slice(0,cap);
   for(const item of unique){
    const data_url=await imgData(item.blob);
    const uploaded=await api({action:'upload_reference',data_url});
    reference_image_urls.push(uploaded.url);
   }
  }catch(e){return toast(e.message||'Gambar referensi gagal diunggah.')}
 }
 for(let k=0;k<S.set.n;k++){
  const it={id:uid(),kind:'result',type:'video',status:'processing',prompt:pr,model:m.id,srcId:src?.id};p.items.unshift(it);
  run(it,{action:'create',model:m.id,prompt:pr,ratio:S.set.ratio,resolution:S.set.res,duration:S.set.dur,reference_image_urls})}
 save();toast(`${S.set.n} video diproses. Boleh geser ke item lain.`);
 if(!src){p.draft='';route()}
}

// ===== Tampilan =====
const src=it=>it.blob?(U[it.id]??=URL.createObjectURL(it.blob)):it.url;
const spin='<div class="w-7 h-7 rounded-full border-2 border-amber-500 border-t-transparent animate-spin"></div>';
function thumb(it,c=''){
 if(it.status==='processing')return`<div class="${c} grid place-items-center bg-neutral-900">${spin}</div>`;
 if(it.status==='failed')return`<div class="${c} grid place-items-center bg-neutral-900 text-[11px] text-red-400">Gagal</div>`;
 return it.type==='image'?`<img src="${src(it)}" alt="" class="${c} object-cover">`:`<video src="${src(it)}#t=0.1" muted playsinline preload="metadata" class="${c} object-cover"></video>`}
const nav=(a)=>`<nav class="fixed inset-x-0 bottom-0 z-30 border-t border-neutral-800 bg-neutral-950" style="padding-bottom:env(safe-area-inset-bottom)" aria-label="Menu utama"><div class="max-w-xl mx-auto grid grid-cols-5 h-14 text-[10px] font-semibold">
<a href="/" class="flex flex-col items-center justify-center gap-0.5 text-neutral-400"><span class="text-base">🏠</span>Beranda</a>
<a href="#/" class="flex flex-col items-center justify-center gap-0.5 ${a==='akun'?'text-neutral-400':'text-amber-400'}"><span class="text-base">🎬</span>Video AI</a>
<a href="/story" class="flex flex-col items-center justify-center gap-0.5 text-neutral-400"><span class="text-base">📝</span>Story AI</a>
<a href="/chat" class="flex flex-col items-center justify-center gap-0.5 text-neutral-400"><span class="text-base">💬</span>Chat</a>
<button type="button" onclick="location.hash='#/akun'" class="flex flex-col items-center justify-center gap-0.5 ${a==='akun'?'text-amber-400':'text-neutral-400'}"><span class="text-base">👤</span>Akun</button></div></nav>`;
const panel=(ph,d='')=>`<div class="fixed inset-x-0 bottom-0 z-30 bg-neutral-900 rounded-t-3xl px-5 pt-5" style="padding-bottom:calc(1rem + env(safe-area-inset-bottom))"><div class="max-w-xl mx-auto">
<textarea id="pr" rows="2" maxlength="2000" placeholder="${ph}" aria-label="Ceritakan video yang ingin dibuat" class="w-full bg-transparent text-lg placeholder-neutral-500 outline-none resize-none">${esc(d)}</textarea>
<div class="flex items-center gap-2 mt-3"><button id="plus" type="button" aria-label="Tambah gambar atau video referensi" title="Tambah gambar atau video referensi" class="w-11 h-11 text-2xl">＋</button><span id="cost" class="flex-1 text-[11px] text-neutral-400"></span>
<button id="chip" type="button" class="px-4 py-3 rounded-full bg-neutral-800 border border-neutral-700 text-xs"></button>
<button id="go" type="button" aria-label="Mulai membuat video" title="Mulai membuat video" class="w-12 h-12 rounded-full bg-gradient-to-r from-amber-500 to-amber-700 text-black text-xl font-bold">→</button></div></div></div>`;
function upd(){const c=$('chip');if(!c)return;c.textContent=`${cur().name} · ${S.set.ratio} · x${S.set.n}`;$('cost').textContent=`Biaya ${price()} kredit · Saldo ${balTxt()}`}
function bindPanel(p,it){upd();$('pr').oninput=e=>{(it||p).draft=e.target.value};$('plus').onclick=()=>$('file').click();$('chip').onclick=()=>openSheet('set');$('go').onclick=()=>generate(p,it,$('pr').value)}

function route(){const[,k,a,b]=location.hash.split('/'),p=S.projects.find(x=>x.id===a);closeSheet();
 if(k==='p'&&p)return viewProject(p);
 if(k==='v'&&p){const it=p.items.find(x=>x.id===b);if(it)return viewItem(p,it);return location.replace('#/p/'+p.id)}
 if(k==='akun')return viewAkun();
 if(k==='antrean')return viewAntrean();
 viewList()}

function viewList(){
 $('view').innerHTML=`<header class="flex items-center justify-between px-4 h-14"><a href="/" class="font-extrabold text-lg">Kamisah</a><span class="text-[11px] text-neutral-400">Saldo: <b id="bal">${balTxt()}</b></span></header>
<div class="px-4 pb-28 max-w-xl mx-auto"><div class="flex items-center justify-between mt-3 mb-4"><h1 class="text-2xl font-bold">Project</h1><button id="newP" type="button" class="px-5 py-3 rounded-2xl bg-neutral-900 text-sm font-semibold">＋ Baru</button></div>
<a href="#/antrean" class="block mb-4 text-xs text-amber-400 underline">Antrean generate${(n=>n?` · ${n} memproses`:'')(S.projects.flatMap(p=>p.items).filter(i=>i.status==='processing').length)}</a>
<form id="newF" class="hidden mb-4 flex gap-2"><input id="newN" maxlength="40" placeholder="Nama project" aria-label="Nama project" class="flex-1 px-4 py-3 rounded-2xl bg-neutral-900 text-sm outline-none border border-neutral-800 focus:border-amber-500"><button class="px-4 rounded-2xl bg-amber-500 text-black text-sm font-bold">Buat</button></form>
${S.projects.map(p=>`<div class="flex items-center gap-2 mb-3"><a href="#/p/${p.id}" class="flex items-center gap-4 flex-1 min-w-0">${p.items[0]?thumb(p.items[0],'w-28 h-20 rounded-2xl shrink-0'):'<div class="w-28 h-20 rounded-2xl bg-neutral-900 shrink-0"></div>'}<div class="min-w-0"><div class="font-semibold truncate">${esc(p.name)}</div><div class="text-xs text-neutral-400 mt-1">${p.items.length} item</div></div></a><button type="button" data-del="${p.id}" aria-label="Hapus project ${esc(p.name)}" class="w-11 h-11 text-neutral-400">⋮</button></div>`).join('')||'<p class="text-sm text-neutral-400">Belum ada project. Tekan Baru untuk mulai.</p>'}</div>${nav()}`;
 $('newP').onclick=()=>{$('newF').classList.toggle('hidden');$('newN').focus()};
 $('newF').onsubmit=e=>{e.preventDefault();const n=$('newN').value.trim();if(!n)return;const p={id:uid(),name:n,items:[]};S.projects.unshift(p);save();location.hash='#/p/'+p.id};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const p=S.projects.find(x=>x.id===b.dataset.del);if(confirm(`Hapus project "${p.name}" beserta isinya?`)){p.items.forEach(i=>i.gone=true);S.projects=S.projects.filter(x=>x!==p);save();route()}})}

function viewProject(p){
 fit('text');
 if(PEND&&!p.draft){p.draft=PEND;PEND=null;try{localStorage.removeItem('kh_vprompt')}catch{}}
 const ready=p.items.filter(it=>it.status==='ready');
 const hero=ready[0]||null;
 const heroMedia=hero
   ? (hero.type==='image'
      ? `<img src="${src(hero)}" alt="Pratinjau proyek" class="w-full h-full object-contain">`
      : `<video src="${src(hero)}#t=0.1" muted playsinline controls class="w-full h-full object-contain"></video>`)
   : `<div class="h-full min-h-[250px] flex flex-col items-center justify-center text-center px-7 bg-gradient-to-br from-neutral-900 via-neutral-950 to-indigo-950"><div class="text-4xl mb-3">✦</div><div class="text-lg font-bold">Mulai buat video</div><p class="text-sm text-neutral-400 mt-2">Tulis ide di bawah. Kamu bisa menambahkan gambar atau video sebagai referensi.</p></div>`;
 $('view').innerHTML=`<div class="max-w-xl mx-auto min-h-screen pb-64" id="khProject">
   <header class="sticky top-0 z-20 flex items-center gap-3 px-4 h-14 bg-black/90 backdrop-blur border-b border-white/5">
     <a href="#/" aria-label="Kembali ke proyek" class="w-10 h-10 grid place-items-center rounded-xl bg-neutral-900">←</a>
     <div class="flex-1 min-w-0"><h1 class="font-bold truncate">${esc(p.name)}</h1><p class="text-[11px] text-neutral-500">${p.items.length} media · ${ready.length} selesai</p></div>
     <button id="ren" type="button" aria-label="Ganti nama proyek" class="w-10 h-10 rounded-xl bg-neutral-900">✎</button>
   </header>
   <section class="px-3 pt-3">
     <div class="relative overflow-hidden rounded-2xl bg-neutral-950 border border-white/10 aspect-[9/11] max-h-[54dvh]">
       ${heroMedia}
       ${hero?`<a href="#/v/${p.id}/${hero.id}" class="absolute bottom-3 right-3 rounded-full bg-black/70 border border-white/20 px-3 py-2 text-xs font-semibold">Buka pratinjau ↗</a>`:''}
       ${!hero&&p.items.some(i=>i.status==='processing')?`<div class="absolute bottom-3 left-3 rounded-full bg-black/70 px-3 py-2 text-xs">⏳ ${p.items.filter(i=>i.status==='processing').length} sedang diproses</div>`:''}
     </div>
   </section>
   <section class="px-4 pt-4">
     <div class="flex items-center justify-between mb-3"><div><h2 class="font-bold">Media proyek</h2><p class="text-xs text-neutral-500 mt-1">Gambar dan video yang sudah kamu buat</p></div><span class="text-xs text-neutral-400">${p.items.length} item</span></div>
     <div class="flex gap-2 overflow-x-auto pb-2 kh-media-strip">
       <button id="plusMedia" type="button" class="w-[76px] h-[96px] shrink-0 rounded-xl border border-dashed border-violet-400/70 bg-violet-950/20 flex flex-col items-center justify-center gap-1 text-violet-200"><span class="text-2xl">＋</span><span class="text-[11px]">Tambah</span></button>
       ${p.items.slice(0,30).map(it=>`<a href="#/v/${p.id}/${it.id}" class="relative w-[76px] h-[96px] shrink-0 rounded-xl overflow-hidden border ${it.id===hero?.id?'border-violet-400 ring-1 ring-violet-400/50':'border-white/10'}">${thumb(it,'w-full h-full')}<span class="absolute bottom-1 left-1 right-1 text-[9px] text-center bg-black/70 rounded py-0.5">${it.status==='processing'?'Diproses':it.status==='failed'?'Gagal':it.type==='image'?'Gambar':'Video'}</span></a>`).join('')}
     </div>
     ${p.items.length>30?`<a href="#/antrean" class="inline-block mt-2 text-xs text-violet-300">Lihat antrean dan item lainnya →</a>`:''}
   </section>
   <section class="px-4 pt-4">
     <div class="flex items-center justify-between mb-2"><h2 class="font-bold">Apa yang ingin kamu buat?</h2><span class="text-[11px] text-neutral-500">Bahasa sehari-hari boleh</span></div>
     <div class="flex flex-wrap gap-2 mb-3">
       <button type="button" id="ideaPrompt" class="rounded-full border border-violet-400/30 bg-violet-950/30 px-3 py-2 text-xs text-violet-200">✦ Bantu buat prompt</button>
       <button type="button" id="ideaSurprise" class="rounded-full border border-white/10 bg-neutral-900 px-3 py-2 text-xs text-neutral-300">🎲 Ide acak</button>
     </div>
   </section>
 </div>
 ${panel('Contoh: Buat adegan sinematik saat Kong berjalan di kota yang hancur…',p.draft)}`;
 $('ren').onclick=()=>{const n=prompt('Nama project',p.name);if(n&&n.trim()){p.name=n.trim().slice(0,40);save();route()}};
 $('plusMedia').onclick=()=>$('file').click();
 $('ideaPrompt').onclick=()=>{const pr=$('pr');pr.value=(pr.value?pr.value+' ':'')+'Buat video sinematik dengan pencahayaan dramatis, gerakan kamera halus, detail realistis, dan komposisi film.';pr.dispatchEvent(new Event('input'));pr.focus()};
 $('ideaSurprise').onclick=()=>{const ideas=['Seekor naga raksasa terbang di atas kota futuristik saat matahari terbenam, gaya sinematik.','Kong berjalan keluar dari hutan berkabut menuju kota yang ditinggalkan, kamera mengikuti dari belakang.','Sebuah kapal luar angkasa mendarat di padang pasir luas, debu berputar diterpa angin, film sci-fi realistis.','Seorang ksatria berzirah berjalan melewati reruntuhan kastil di tengah hujan, pencahayaan dramatis.'];const pr=$('pr');pr.value=ideas[Math.floor(Math.random()*ideas.length)];pr.dispatchEvent(new Event('input'));pr.focus()};
 bindPanel(p,null);
}
function viewItem(p,it){const i=p.items.indexOf(it),rdy=it.status==='ready';if(rdy)fit(it.type);const c=DIR?(DIR>0?'sl':'sr'):'';DIR=0;
 const media=!rdy?(it.status==='failed'?`<p class="text-sm text-red-400 text-center px-6">${esc(it.error||'Pembuatan video gagal.')}</p>`:`<div class="text-center text-sm text-neutral-300 px-6"><div class="w-9 h-9 mx-auto mb-3 rounded-full border-2 border-amber-500 border-t-transparent animate-spin"></div>Sedang dibuat. Geser ke item lain, proses tetap berjalan.<p class="mt-3 text-xs text-neutral-500">${esc(it.prompt)}</p></div>`):it.type==='image'?`<img src="${src(it)}" alt="" class="max-h-full max-w-full rounded-2xl">`:`<video src="${src(it)}" controls playsinline loop class="max-h-full max-w-full rounded-2xl"></video>`;
 $('view').innerHTML=`<div class="fixed inset-0 bg-black"><div class="absolute top-0 inset-x-0 z-20 flex items-center justify-between p-4"><a href="#/p/${p.id}" aria-label="Tutup" class="w-11 h-11 grid place-items-center rounded-2xl bg-neutral-900">⌄</a><span class="text-xs text-neutral-400">${i+1}/${p.items.length}</span>
<div class="flex gap-2">${it.kind==='result'&&it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" download aria-label="Unduh" class="w-11 h-11 grid place-items-center rounded-2xl bg-neutral-900">⬇</a>`:''}<button id="del" type="button" aria-label="Hapus item" class="w-11 h-11 rounded-2xl bg-neutral-900">🗑</button></div></div>
<div id="stage" class="absolute inset-x-0 top-20 ${rdy?'bottom-56':'bottom-4'} grid place-items-center px-4 ${c}">${media}</div>${rdy?panel('Apa yang ingin Anda ubah?',it.draft):''}</div>`;
 if(rdy)bindPanel(p,it);
 $('del').onclick=()=>{if(confirm('Hapus item ini?')){it.gone=true;p.items.splice(i,1);save();location.replace('#/p/'+p.id)}};
 const sg=$('stage');let x0,y0,skip;
 sg.ontouchstart=e=>{const t=e.touches[0],v=e.target.closest('video');x0=t.clientX;y0=t.clientY;skip=v&&t.clientY>v.getBoundingClientRect().bottom-56};
 sg.ontouchend=e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(p,it,dx<0?1:-1)}}
function go(p,it,d){const n=p.items[p.items.indexOf(it)+d];if(!n)return toast(d>0?'Ini item terakhir.':'Ini item pertama.');DIR=d;location.replace(`#/v/${p.id}/${n.id}`)}

function viewAkun(){
 const np=S.projects.length,ni=S.projects.reduce((a,p)=>a+p.items.length,0);
 $('view').innerHTML=`<header class="flex items-center justify-between px-4 h-14 max-w-xl mx-auto"><a href="/" class="font-extrabold text-lg">Kamisah</a></header><div class="px-4 pb-28 max-w-xl mx-auto"><h1 class="text-2xl font-bold mt-3 mb-4">Akun</h1>
<div class="rounded-2xl bg-neutral-900 p-4 mb-3"><div class="text-xs text-neutral-400">Email</div><div class="text-sm font-semibold mb-3">${SES?esc(SES.user.email):'Belum masuk'}</div><div class="text-xs text-neutral-400">Saldo kredit</div><div class="text-2xl font-extrabold text-amber-400">${balTxt()}</div><p class="text-[11px] text-neutral-500 mt-1">1 kredit = Rp100. Top-up menyusul.</p>
<button id="acBtn" type="button" class="mt-3 w-full py-3 rounded-2xl ${SES?'bg-neutral-800':'bg-amber-500 text-black'} text-sm font-bold">${SES?'Keluar':SB?'Masuk / Daftar':'Login belum dikonfigurasi'}</button></div>
<div class="rounded-2xl bg-neutral-900 p-4 mb-3 text-xs text-neutral-300">Di perangkat ini: ${np} project, ${ni} item.</div>
<h2 class="text-sm font-bold mb-2">Top-up saldo (QRIS)</h2><div class="grid grid-cols-2 gap-2 mb-3">${[5000,10000,25000,50000].map(a=>`<button type="button" data-tp="${a}" class="rounded-2xl bg-neutral-900 border border-neutral-800 py-3 text-xs font-bold">Rp${a.toLocaleString('id-ID')}<div class="text-[10px] font-normal text-neutral-400">${a/100} kredit</div></button>`).join('')}</div>
<div class="rounded-2xl border border-neutral-800 bg-neutral-900 p-3 mb-3"><label for="customTopupAmount" class="block text-xs font-semibold mb-2">Atau masukkan nominal sendiri</label><div class="flex gap-2"><div class="flex min-w-0 flex-1 items-center rounded-xl border border-neutral-700 bg-neutral-950 px-3"><span class="text-sm text-neutral-400 mr-2">Rp</span><input id="customTopupAmount" type="number" inputmode="numeric" min="10000" max="10000000" step="100" placeholder="Contoh: 100000 atau 500000" class="w-full min-w-0 bg-transparent py-3 text-sm outline-none" aria-describedby="customTopupHelp"></div><button type="button" id="customTopupBtn" class="rounded-xl bg-amber-500 px-4 py-3 text-xs font-bold text-black">Lanjut</button></div><p id="customTopupHelp" class="mt-2 text-[11px] text-neutral-400">Minimal Rp10.000 · Maksimal Rp10.000.000 · 1 kredit = Rp100.</p><p id="customTopupCredits" class="mt-1 text-xs text-amber-400"></p></div><p class="text-[11px] text-neutral-500 mb-4">Kredit masuk otomatis setelah pembayaran terkonfirmasi. Kredit tidak bisa ditransfer antar akun.</p>
<h2 class="text-sm font-bold mb-2">Riwayat kredit</h2><div id="hist" class="space-y-2 text-xs text-neutral-400">${SES?'Memuat…':'Masuk untuk melihat riwayat.'}</div></div>${nav('akun')}`;
 $('acBtn').onclick=()=>SES?SB.auth.signOut().then(()=>route()):openAuth();
 document.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>startTopup(+b.dataset.tp));
 const customAmount=$('customTopupAmount'),customBtn=$('customTopupBtn'),customCredits=$('customTopupCredits');
 const updateCustomCredits=()=>{const a=Number(customAmount?.value);if(customCredits)customCredits.textContent=Number.isInteger(a)&&a>=10000&&a<=10000000&&a%100===0?`Kamu akan menerima ${(a/100).toLocaleString('id-ID')} kredit.`:''};
 if(customAmount){customAmount.addEventListener('input',updateCustomCredits);customAmount.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();customBtn?.click()}})}
 if(customBtn)customBtn.onclick=()=>{const a=Number(customAmount?.value);if(!Number.isSafeInteger(a)||a<10000||a>10000000||a%100!==0){toast('Masukkan nominal Rp10.000–Rp10.000.000 dengan kelipatan Rp100.');return}startTopup(a)};
 if(SES)SB.from('ledger').select('delta,reason,created_at').order('created_at',{ascending:false}).limit(30).then(({data})=>{const e=$('hist');if(!e)return;const L={generate:'Generate video',refund:'Pengembalian',topup:'Top-up',chat:'Chat AI',bonus:'Bonus pendaftaran'};
  e.innerHTML=(data||[]).map(r=>`<div class="flex justify-between rounded-xl bg-neutral-900 px-3 py-2"><span>${L[r.reason]||esc(r.reason)} · ${new Date(r.created_at).toLocaleDateString('id-ID')}</span><b class="${r.delta>0?'text-emerald-400':'text-neutral-200'}">${r.delta>0?'+':''}${r.delta}</b></div>`).join('')||'Belum ada transaksi.'})}

function viewAntrean(){
 const all=S.projects.flatMap(p=>p.items.filter(i=>i.kind==='result').map(i=>({p,i}))),lab={processing:['Memproses','text-amber-400'],ready:['Selesai','text-emerald-400'],failed:['Gagal','text-red-400']};
 $('view').innerHTML=`<div class="max-w-xl mx-auto px-4 pb-10"><div class="flex items-center gap-3 h-14"><a href="#/" aria-label="Kembali" class="w-11 h-11 grid place-items-center rounded-2xl bg-neutral-900">←</a><h1 class="font-bold">Antrean generate</h1></div>
${all.map(({p,i})=>`<a href="#/v/${p.id}/${i.id}" class="flex items-center gap-3 mb-2 rounded-2xl bg-neutral-900 p-2">${thumb(i,'w-16 h-16 rounded-xl shrink-0')}<div class="min-w-0 flex-1"><div class="text-xs truncate">${esc(i.prompt)}</div><div class="text-[11px] ${i.status==='failed'?'text-red-400':'text-neutral-500'} truncate">${i.status==='failed'?esc(i.error):esc(p.name)+' · '+(M(i.model)?.name||'')}</div></div><b class="text-[11px] ${lab[i.status][1]}">${lab[i.status][0]}</b></a>`).join('')||'<p class="text-sm text-neutral-400">Belum ada pekerjaan generate.</p>'}
${all.some(x=>x.i.status==='failed')?'<button id="clr" type="button" class="mt-3 w-full py-3 rounded-2xl bg-neutral-900 text-xs font-semibold">Hapus yang gagal</button>':''}</div>`;
 const c=$('clr');if(c)c.onclick=()=>{S.projects.forEach(p=>p.items=p.items.filter(i=>i.status!=='failed'));save();route()}}

// ===== Sheet pengaturan & model =====
function closeSheet(){$('sheet').innerHTML=''}
function openSheet(v){SV=v;renderSheet()}
function renderSheet(){const m=cur(),seg=(k,a,val,l=x=>x)=>`<div class="flex bg-neutral-800 rounded-2xl p-1 mb-2">${a.map(o=>`<button type="button" data-k="${k}" data-v="${o}" aria-pressed="${o===val}" class="flex-1 py-3 rounded-xl text-sm ${o===val?'bg-neutral-700 text-white font-semibold':'text-neutral-400'}">${l(o)}</button>`).join('')}</div>`;let h;
 if(SV==='model')h=MODELS.map(x=>{const a=ok(x,CTX),sub=!x.on?x.note:!a?'Tidak tersedia untuk setelan saat ini':x.cost!=null?x.cost+' kredit/video':x.costSec+' kredit/detik';return`<button type="button" data-m="${x.id}" ${a?'':'disabled'} class="w-full text-left p-4 rounded-2xl mb-1 ${x.id===m.id?'bg-neutral-800':''} disabled:opacity-40"><div class="font-semibold">${x.name}</div><div class="text-xs text-neutral-400 ${a?'':'italic'}">${sub}</div></button>`}).join('');
 else h=`<p class="text-center text-sm text-neutral-300 mb-3">Pembuatan akan menggunakan <b class="underline"><span id="sc">${price()}</span> kredit</b></p>${seg('ratio',['16:9','9:16','1:1','4:3','3:4','21:9'],S.set.ratio)}${seg('res',m.res,S.set.res)}${seg('n',[1,2,3,4],S.set.n,x=>'x'+x)}${m.dur?`<div class="bg-neutral-800 rounded-2xl p-4 mb-2"><div class="flex justify-between text-sm mb-2"><label for="dur">Durasi</label><b id="dl">${S.set.dur} detik</b></div><input id="dur" type="range" min="${m.dur[0]}" max="${m.dur[1]}" value="${S.set.dur}" class="w-full accent-amber-500"></div>`:''}<button type="button" id="pickM" class="w-full flex justify-between p-4 rounded-2xl bg-neutral-800 text-sm"><span>${m.name}</span><span>▾</span></button>`;
 $('sheet').innerHTML=`<div data-close class="fixed inset-0 z-40 bg-black/50"></div><div class="fixed inset-x-0 bottom-0 z-50 max-h-[75dvh] overflow-auto rounded-t-3xl bg-neutral-900 p-3" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom))">${h}</div>`}
$('sheet').onclick=e=>{const t=e.target;if(t.dataset.close!==undefined)return closeSheet();const b=t.closest('button');if(!b)return;
 if(b.dataset.k)S.set[b.dataset.k]=b.dataset.k==='n'?+b.dataset.v:b.dataset.v;
 else if(b.dataset.m){S.set.model=b.dataset.m;fit(CTX);SV='set'}
 else if(b.id==='pickM')SV='model';else return;
 save();renderSheet();upd()};
$('sheet').oninput=e=>{if(e.target.id!=='dur')return;S.set.dur=+e.target.value;$('dl').textContent=S.set.dur+' detik';$('sc').textContent=price();upd();save()};

// ===== Login & saldo (Supabase). Kosong di config.js = mode tanpa login =====
let SB=null,SES=null,BAL=null,CT=null;const balTxt=()=>BAL===null?'—':BAL;
async function initAuth(){const c=window.KH||{};if(!c.SUPABASE_URL||!c.SUPABASE_PUBLISHABLE_KEY||!window.supabase)return;SB=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);const{data}=await SB.auth.getSession();SES=data.session;await refreshBal();SB.auth.onAuthStateChange((_e,s)=>{SES=s;refreshBal()})}
async function refreshBal(){if(!SB||!SES){BAL=null}else{const{data,error}=await SB.from('wallets').select('balance').eq('user_id',SES.user.id).maybeSingle();if(error){console.error('Kamisah: gagal membaca saldo',error.message);BAL=null}else{BAL=data?data.balance:0}}const e=$('bal');if(e)e.textContent=balTxt();upd()}
function openAuth(msg){
 if(!SB)return toast('Login belum dikonfigurasi (isi config.js).');
 const box=SES?`<p class="text-sm mb-1">${esc(SES.user.email)}</p><p class="text-xs text-neutral-400 mb-4">Saldo: <b>${balTxt()}</b> kredit</p><button type="button" id="out" class="w-full py-3 rounded-2xl bg-neutral-800 text-sm font-semibold">Keluar</button>`
 :`<p class="text-sm font-bold mb-3">${esc(msg||'Masuk atau daftar')}</p><input id="em" type="email" autocomplete="email" placeholder="Email" aria-label="Email" class="w-full mb-2 px-4 py-3 rounded-2xl bg-neutral-800 text-sm outline-none"><input id="pw" type="password" autocomplete="current-password" placeholder="Kata sandi (min. 8)" aria-label="Kata sandi" class="w-full mb-2 px-4 py-3 rounded-2xl bg-neutral-800 text-sm outline-none"><div id="cf" class="mb-3"></div><div class="grid grid-cols-2 gap-2"><button type="button" id="si" class="py-3 rounded-2xl bg-amber-500 text-black text-sm font-bold">Masuk</button><button type="button" id="su" class="py-3 rounded-2xl bg-neutral-800 text-sm font-semibold">Daftar</button></div><button type="button" id="ph" class="mt-3 w-full text-xs text-amber-400 underline">Masuk / daftar dengan nomor HP (OTP)</button>`;
 $('sheet').innerHTML=`<div data-close class="fixed inset-0 z-40 bg-black/50"></div><div class="fixed inset-x-0 bottom-0 z-50 rounded-t-3xl bg-neutral-900 p-5" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))">${box}</div>`;
 if(SES)$('out').onclick=async()=>{await SB.auth.signOut();closeSheet();toast('Sudah keluar.')};
 else{const go=async up=>{const email=$('em').value.trim(),password=$('pw').value;if(!email||password.length<8)return toast('Isi email dan kata sandi (min. 8 karakter).');
  const k=(window.KH||{}).TURNSTILE_SITEKEY;if(k&&!CT)return toast('Selesaikan verifikasi captcha dulu.');const o={email,password,options:{captchaToken:CT||undefined}};const{data,error}=up?await SB.auth.signUp(o):await SB.auth.signInWithPassword(o);
  if(error){CT=null;if(k&&window.turnstile)turnstile.reset();return toast(/Database error/i.test(error.message)?'Pendaftaran ditolak. Pakai email aktif yang belum pernah terdaftar.':error.message)}if(!data.session)return toast('Cek email untuk konfirmasi, lalu masuk.');closeSheet();toast('Berhasil masuk.')};
  $('si').onclick=()=>go(false);$('su').onclick=()=>go(true);$('ph').onclick=openPhone;const k=(window.KH||{}).TURNSTILE_SITEKEY;CT=null;if(k&&window.turnstile)turnstile.render('#cf',{sitekey:k,callback:t=>{CT=t}})}}

async function startTopup(amt){
 if(!SB||!SES)return openAuth('Masuk dulu untuk top-up.');
 try{
  const r=await fetch('/.netlify/functions/topup',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+SES.access_token},body:JSON.stringify({amount:amt})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Gagal membuat tagihan.');
  $('sheet').innerHTML=`<div data-close class="fixed inset-0 z-40 bg-black/50"></div><div class="fixed inset-x-0 bottom-0 z-50 rounded-t-3xl bg-neutral-900 p-5 text-center" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))"><p class="text-sm font-bold">Scan QRIS · Rp${amt.toLocaleString('id-ID')}</p><img src="${esc(d.qr_url)}" alt="Kode QRIS" class="mx-auto my-3 w-56 h-56 rounded-2xl bg-white object-contain"><p id="tps" class="text-xs text-neutral-400">Menunggu pembayaran… (${d.credits} kredit)</p></div>`;
  const end=Date.parse(d.expires_at)||Date.now()+9e5;
  while(Date.now()<end&&$('tps')){await sleep(4000);const{data}=await SB.from('topups').select('status').eq('id',d.id).maybeSingle();
   if(data&&data.status==='paid'){closeSheet();toast('Pembayaran diterima. Kredit bertambah.');await refreshBal();if(location.hash==='#/akun')route();return}}
  if($('tps'))$('tps').textContent='Tagihan kedaluwarsa. Buat tagihan baru.';
 }catch(e){toast(e.message)}}

function openPhone(){
 $('sheet').innerHTML=`<div data-close class="fixed inset-0 z-40 bg-black/50"></div><div class="fixed inset-x-0 bottom-0 z-50 rounded-t-3xl bg-neutral-900 p-5" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))"><p class="text-sm font-bold mb-3">Masuk dengan nomor HP</p><input id="hp" type="tel" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx" aria-label="Nomor HP" class="w-full mb-2 px-4 py-3 rounded-2xl bg-neutral-800 text-sm outline-none"><input id="otp" inputmode="numeric" maxlength="8" placeholder="Kode OTP" aria-label="Kode OTP" class="hidden w-full mb-2 px-4 py-3 rounded-2xl bg-neutral-800 text-sm outline-none"><div id="cf" class="mb-3"></div><button type="button" id="sendOtp" class="w-full py-3 rounded-2xl bg-amber-500 text-black text-sm font-bold">Kirim kode OTP</button><p class="text-[11px] text-neutral-500 mt-2">Bonus 10 kredit untuk nomor yang baru terverifikasi, sekali per nomor.</p></div>`;
 let sent=false,phone='';const k=(window.KH||{}).TURNSTILE_SITEKEY;CT=null;if(k&&window.turnstile)turnstile.render('#cf',{sitekey:k,callback:t=>{CT=t}});
 $('sendOtp').onclick=async()=>{
  if(!sent){let p=$('hp').value.replace(/[^\d+]/g,'');if(p.startsWith('0'))p='+62'+p.slice(1);else if(p.startsWith('62'))p='+'+p;
   if(!/^\+\d{9,15}$/.test(p))return toast('Nomor HP tidak valid.');if(k&&!CT)return toast('Selesaikan verifikasi captcha dulu.');
   const{error}=await SB.auth.signInWithOtp({phone:p,options:{captchaToken:CT||undefined}});
   if(error){CT=null;if(k&&window.turnstile)turnstile.reset();return toast(error.message)}
   phone=p;sent=true;$('otp').classList.remove('hidden');$('sendOtp').textContent='Verifikasi';toast('Kode OTP dikirim.')}
  else{const{data,error}=await SB.auth.verifyOtp({phone,token:$('otp').value.trim(),type:'sms'});
   if(error)return toast('Kode salah atau kedaluwarsa.');if(data.session){closeSheet();toast('Berhasil masuk.')}}}}

// ===== Unggah & mulai =====
$('file').onchange=e=>{const p=S.projects.find(x=>x.id===location.hash.split('/')[2]);if(!p)return;
 [...e.target.files].forEach(f=>{const t=f.type.startsWith('video')?'video':f.type.startsWith('image')?'image':null;if(t)p.items.unshift({id:uid(),kind:'upload',type:t,blob:f,status:'ready'})});
 e.target.value='';save();route()};
(async()=>{await initAuth();refreshBal();const d=await load();if(d&&d.projects)S={...S,...d,set:{...S.set,...d.set}};if(!M(S.set.model)||!M(S.set.model).on)S.set.model='seedance-2.0-fast';
 S.projects.forEach(p=>p.items.forEach(it=>{if(it.status==='processing'){if(it.jobId)run(it);else{it.status='failed';it.error='Terputus saat halaman dimuat ulang.'}}}));
 addEventListener('hashchange',route);route();if(PEND)toast('Prompt dari Story AI siap. Buka project, prompt terisi otomatis.')})();
</script>
