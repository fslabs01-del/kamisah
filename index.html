<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030d1a">
<title>Kamisah AI — Beranda Kreator</title>
<meta name="description" content="Beranda Kamisah AI: studio film, alur cerita, musik, video, cerita, chat, dan ide konten.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#030d1a;--panel:#0a1828;--muted:#b5c5d9;--cyan:#08d8ff;--violet:#a83cff;--green:#00e0a0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:#f7fbff;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
.app{width:min(100%,720px);min-height:100dvh;margin:auto;padding-bottom:calc(82px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#061322,#020a14 72%)}
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(3,13,26,.96);border-bottom:1px solid #12243a;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1;color:white;text-decoration:none}.logo{width:42px;height:42px;flex-shrink:0}.brand-name{font-size:clamp(16px,4.4vw,22px);font-weight:800;line-height:1.1;letter-spacing:-.8px;white-space:nowrap}.brand-name span{background:linear-gradient(90deg,#13d7ff,#b04aff);background-clip:text;color:transparent}.tagline{font-size:9px;color:#aabbd0;white-space:nowrap;margin-top:3px}
.credit{display:flex;align-items:center;gap:6px;border:1px solid #4c3c73;border-radius:22px;padding:5px 8px;background:#0c1227;white-space:nowrap;min-width:0}.coin{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:linear-gradient(135deg,#ffe18a,#f4a900);color:#6b3b00;font-size:16px;box-shadow:0 0 12px #ffb80033}.balance{font-size:11px;font-weight:800;line-height:1.1;text-align:center}.balance small{display:block;font-size:9px;color:#b4c0d5;font-weight:500;margin-top:2px}.topup{border:0;border-radius:12px;padding:8px 10px;background:linear-gradient(120deg,#a43fff,#692bdb);color:white;font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap}
.icon-btn{width:28px;height:34px;display:grid;place-items:center;border:0;background:transparent;color:#d5e0ef;font-size:21px;text-decoration:none;flex-shrink:0;position:relative}.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#ff5e6b;right:2px;top:5px}.avatar{width:34px;height:34px;border-radius:50%;border:1px solid #5d7591;background:linear-gradient(140deg,#d2a5ff,#3c7b9c);display:grid;place-items:center;overflow:hidden;color:#071321;font-size:13px;font-weight:800;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}
.content{padding:10px 14px 20px}
.banner{display:block;width:100%;border:1px solid #a28a48;border-radius:20px;overflow:hidden;box-shadow:0 0 24px #ffbf2720;text-decoration:none;line-height:0}.banner img{display:block;width:100%;height:auto}
.section-title{margin:17px 0 12px}.section-title h1{font-size:clamp(23px,6vw,30px);line-height:1.15;letter-spacing:-.8px;margin:0;font-weight:800}.section-title h1 .spark{color:#ffdc45}.section-title h1 .gradient{background:linear-gradient(90deg,#c179ff,#26bfff);background-clip:text;color:transparent}.section-title p{font-size:clamp(12px,3.5vw,15px);line-height:1.45;color:var(--muted);margin:5px 0 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.feature{display:block;border-radius:17px;overflow:hidden;border:1px solid #24455c;background:#0b1726;line-height:0;transition:transform .16s ease,filter .16s ease}.feature:active{transform:scale(.985)}.feature img{display:block;width:100%;height:auto;aspect-ratio:321/223;object-fit:cover}
.wide-card{display:block;margin-top:10px;overflow:hidden;border-radius:16px;line-height:0;border:1px solid #087d70;background:#06352f}.wide-card img{display:block;width:100%;height:auto}
.prompts{border-color:#19374d;background:#071522}
.bottom-nav{position:fixed;z-index:25;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(3,13,26,.97);border-top:1px solid #162c43;backdrop-filter:blur(16px)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:46px;color:#9aabc1;text-decoration:none;font-size:10px;font-weight:600}.nav-item .nav-icon{font-size:21px;line-height:1.1}.nav-item.active{color:#ffdf38;text-shadow:0 0 16px #ffc40055}.nav-item.active .nav-icon{filter:drop-shadow(0 0 6px #ffcf26)}
@media(max-width:420px){.header{padding:8px 9px;gap:5px}.logo{width:34px;height:34px}.brand{gap:5px}.brand-name{font-size:15px}.tagline{font-size:7px;letter-spacing:-.2px}.credit{padding:4px 5px;gap:4px}.coin{width:21px;height:21px;font-size:13px}.balance{font-size:9px}.balance small{font-size:7px}.topup{font-size:9px;padding:7px 7px}.icon-btn{width:22px;font-size:18px}.avatar{width:29px;height:29px}}\n@media(min-width:600px){.header{padding:13px 20px;gap:12px}.logo{width:48px;height:48px}.tagline{font-size:10px}.credit{padding:6px 10px;gap:8px}.coin{width:29px;height:29px}.topup{padding:9px 14px;font-size:12px}.content{padding:14px 20px 24px}.cards{gap:12px}.feature,.banner,.wide-card{border-radius:20px}.section-title{margin-top:20px}.nav-item{font-size:11px}.nav-item .nav-icon{font-size:23px}}
@media(max-width:370px){.header{padding:8px 9px;gap:5px}.logo{width:35px;height:35px}.brand{gap:5px}.brand-name{font-size:15px}.tagline{font-size:8px}.credit{padding:4px 5px;gap:4px}.coin{width:22px;height:22px;font-size:13px}.balance{font-size:10px}.balance small{font-size:8px}.topup{font-size:10px;padding:7px 8px}.icon-btn{width:23px;font-size:19px}.avatar{width:30px;height:30px}.content{padding-left:10px;padding-right:10px}.cards{gap:7px}.feature{border-radius:13px}.section-title h1{font-size:22px}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <a class="brand" href="index.html" aria-label="Beranda Kamisah AI">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18e1ff"/><stop offset=".55" stop-color="#3458ff"/><stop offset="1" stop-color="#ed2cf5"/></linearGradient></defs><path d="M10 8Q10 2 17 6L57 28Q65 32 57 37L17 59Q10 63 10 55Z" fill="url(#lg)"/><path d="M25 19L46 31L25 44Z" fill="#061426"/></svg>
      <span><span class="brand-name">Kamisah <span>AI</span></span><span class="tagline" style="display:block">Buat Cerita, Visualkan, Jadi Nyata</span></span>
    </a>
    <div class="credit" aria-label="Saldo kredit">
      <span class="coin">◉</span>
      <span class="balance"><span id="balance">—</span><small>Kredit</small></span>
      <a class="topup" href="video-generator.html#/akun">Top Up</a>
    </div>
    <button class="icon-btn" id="notifications" type="button" aria-label="Notifikasi">♟<span class="dot"></span></button>
    <a class="avatar" id="profile" href="video-generator.html#/akun" aria-label="Akun"><span id="avatarInitial">K</span></a>
  </header>

  <div class="content">
    <a class="banner" href="chat.html" aria-label="Chat dulu sama AI">
      <img src="assets/home-banner.webp" alt="Teman cerita kamu: Cinta bikin pusing? Kepikiran buat selingkuh? Pengen cepat kaya? Cerita aja, kita ngobrol dulu. Chat dulu sama AI.">
    </a>

    <section class="section-title">
      <h1><span class="spark">✨</span> Mau Bikin <span class="gradient">Apa Hari Ini?</span></h1>
      <p>Semua alat AI ada di sini. Pilih sesuai kebutuhanmu!</p>
    </section>

    <section class="cards" aria-label="Fitur Kamisah AI">
      <a class="feature" href="studio-film.html" aria-label="Studio Pembuat Film AI"><img src="assets/home-film.webp" alt="Studio Pembuat Film AI — susun cerita, adegan, dan pengambilan gambar untuk membuat film."></a>
      <a class="feature" href="ai-film-analyzer.html" aria-label="Buat Alur Cerita Film"><img src="assets/home-analyzer.webp" alt="Buat Alur Cerita Film — ubah video film menjadi alur cerita secara otomatis."></a>
      <a class="feature" href="music.html" aria-label="Buat Lagu dengan AI"><img src="assets/home-music.webp" alt="Buat Lagu dengan AI — ciptakan lagu, lirik, dan musik sesuai keinginanmu."></a>
      <a class="feature" href="video-generator.html" aria-label="Buat Video AI"><img src="assets/home-video.webp" alt="Buat Video AI dari teks, gambar, atau cerita."></a>
      <a class="feature" href="story.html" aria-label="Buat Cerita dan Naskah"><img src="assets/home-story.webp" alt="Buat Cerita dan Naskah — ubah ide menjadi cerita, naskah, dan storyboard."></a>
      <a class="feature" href="chat.html" aria-label="Chat dan Curhat dengan AI"><img src="assets/home-chat.webp" alt="Chat dan Curhat dengan AI — tanya apa saja, diskusi, atau ceritakan masalahmu."></a>
    </section>

    <a class="wide-card" href="ideas.html" aria-label="Cari Ide Konten">
      <img src="assets/home-ideas.webp" alt="Cari Ide Konten — temukan ide konten untuk YouTube, TikTok, dan Reels.">
    </a>

    <a class="wide-card prompts" href="ideas.html" aria-label="Kumpulan Prompt dan Ide, buka koleksi">
      <img src="assets/home-prompts.webp" alt="Kumpulan Prompt dan Ide — temukan contoh prompt dan ide kreatif yang bisa langsung kamu salin dan gunakan. Buka Koleksi.">
    </a>
  </div>
</main>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async()=>{
  const c=window.KH||{};
  if(!window.supabase||!c.SUPABASE_URL||!c.SUPABASE_PUBLISHABLE_KEY){location.replace('welcome.html');return}
  const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);
  try{
    const {data,error}=await sb.auth.getSession();
    if(error||!data.session){location.replace('welcome.html');return}
    const session=data.session;
    const email=session.user.email||'';
    const metadata=session.user.user_metadata||{};
    const name=metadata.full_name||metadata.name||email.split('@')[0]||'K';
    document.getElementById('avatarInitial').textContent=String(name).trim().charAt(0).toUpperCase();
    const picture=metadata.avatar_url||metadata.picture;
    if(picture){const img=document.createElement('img');img.src=picture;img.alt='';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();document.getElementById('profile').replaceChildren(img)}
    const {data:wallet,error:walletError}=await sb.from('wallets').select('balance').eq('user_id',session.user.id).maybeSingle();
    document.getElementById('balance').textContent=walletError?'—':Number(wallet?.balance||0).toLocaleString('id-ID');
    sb.auth.onAuthStateChange((event,nextSession)=>{if(event==='SIGNED_OUT'||!nextSession)location.replace('welcome.html')});
  }catch(e){console.error('Gagal memeriksa sesi Kamisah',e);location.replace('welcome.html')}
})();
document.getElementById('notifications').addEventListener('click',()=>alert('Belum ada notifikasi baru.'));
</script>
</body>
</html>
